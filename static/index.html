<!doctype html>
<html lang="vi">
<head>

  <script src="https://cdn.tailwindcss.com"></script>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="Form and Fuel trang chủ">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 16h18M10 11v10M22 11v10M5 13v6M27 13v6"/></svg></span>
        <span class="brand-name">form<span>&</span>fuel<small>WELLNESS STUDIO</small></span>

      <div class="side-label">MENU CHÍNH</div>

      </header>
      <div class="page-content" id="appContent"><div class="loading-state">Đang tải dữ liệu sức khỏe…</div></div>

  <div class="toast" id="toast" role="status"></div>
